# Hunter130 AMP model_35000: policy and YAML joint order are identical.
walk_controller:
  ros__parameters:
    joints:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    policy_path: config/policy/amp.onnx
    # No additional IMU pitch offset.
    imu_pitch_offset_deg: 0.0
    log_dir: "/home/milkyway/log/hunter130"

amp_model:
  ros__parameters:
    input_name: obs
    input_shape: [1, 336]
    output_name: actions
    output_shape: [1, 25]
    frame_size: 84
    history_length: 4
    history_layout: time_major
    history_reset: repeat_first_observation
    policy_frequency_hz: 50
    policy_period_s: 0.02
    action_transform: default_position + action_scale * action
    joint_names: [left_hip_pitch_joint, left_hip_roll_joint, left_hip_yaw_joint, left_knee_joint, left_ankle_pitch_joint,
      left_ankle_roll_joint, right_hip_pitch_joint, right_hip_roll_joint, right_hip_yaw_joint, right_knee_joint,
      right_ankle_pitch_joint, right_ankle_roll_joint, waist_yaw_joint, waist_roll_joint, waist_pitch_joint, left_shoulder_pitch_joint,
      left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint, left_wrist_roll_joint, right_shoulder_pitch_joint,
      right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint]
