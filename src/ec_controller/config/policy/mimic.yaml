# Mode 4: neural stand -> reference transition -> motion -> transition -> neural stand.
mimic_controller:
  ros__parameters:
    joints:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    # Standing pose and height default to the selected model metadata.
    # anchor_50h_PD_NoClip 500000-step actor: 810 + 609 inputs; unclipped targets.
    policy_path: config/policy/mimic.onnx
    motion_path: config/motions/disco.csv
    # No additional IMU pitch offset.
    imu_pitch_offset_deg: 0.0
    stand_before_duration: 1.0
    # Direct model-PD takeover; hardware last_command_* history is not required.
    activation_duration: 0.0
    preparation_duration: 3.0
    return_duration: 3.0
    start_position_tolerance: 0.35
    log_dir: /home/milkyway/log/hunter130

# Mode 5 / CH7: calibrated Meta full-body references.
quest_controller:
  ros__parameters:
    joints:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    # Standing pose and height default to the selected model metadata.
    # Quest and Mimic use the same NoClip actor and metadata gains.
    # anchor_50h_PD_NoClip 500000-step actor: 810 + 609 inputs; unclipped targets.
    policy_path: config/policy/mimic.onnx
    stand_before_duration: 1.0
    # Direct model-PD takeover; hardware last_command_* history is not required.
    activation_duration: 0.0
    preparation_duration: 3.0
    return_duration: 3.0
    start_position_tolerance: 0.35
    log_dir: /home/milkyway/log/hunter130

